# Sitemaker.nl — website, klantenportaal (/portaal) en HQ (/hq) in één project.
[build]
  publish = "public"
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # het startsjabloon voor klantsites gaat mee, zodat HQ nieuwe repo's kan vullen
  included_files = ["templates/klantsite/**"]

# Beveiliging voor alle pagina's.
[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"

# Portaal en HQ: niet in zoekmachines en een strikte CSP.
[[headers]]
  for = "/portaal/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/hq/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# ---- Subdomeinen (zelfde project): mijn.sitemaker.nl = klantenportaal, hq.sitemaker.nl = HQ.
# Deze regels doen pas iets zodra die domeinen in Netlify aan dit project hangen; tot dan werkt alles via /portaal/ en /hq/.
[[redirects]]
  from = "https://mijn.sitemaker.nl/"
  to = "/portaal/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://hq.sitemaker.nl/"
  to = "/hq/index.html"
  status = 200
  force = true

# Oude adressen op de website sturen door naar het subdomein (querystring zoals ?betaling=1 gaat mee).
[[redirects]]
  from = "https://sitemaker.nl/portaal/"
  to = "https://mijn.sitemaker.nl/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.sitemaker.nl/portaal/"
  to = "https://mijn.sitemaker.nl/"
  status = 301
  force = true

[[redirects]]
  from = "https://sitemaker.nl/hq/"
  to = "https://hq.sitemaker.nl/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.sitemaker.nl/hq/"
  to = "https://hq.sitemaker.nl/"
  status = 301
  force = true

[[redirects]]
  from = "/portaal"
  to = "/portaal/"
  status = 301

[[redirects]]
  from = "/hq"
  to = "/hq/"
  status = 301
